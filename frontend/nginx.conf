server {
    listen 80;
    server_name _;

    # Root directory where Vite places the production build
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — all unmatched routes (e.g. /dashboard, /profile, /skills)
    # are served index.html so React Router handles client-side navigation.
    # Without this, a browser refresh on /dashboard returns 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose server version in headers
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
